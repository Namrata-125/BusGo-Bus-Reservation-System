<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BusGo | Create Account</title>

    <meta name="description"
          content="Create your BusGo account">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="index.html">

                <i class="bi bi-bus-front-fill"></i>
                BusGo

            </a>

            <div class="ms-auto">

                <a href="index.html"
                   class="btn btn-outline-primary">

                    <i class="bi bi-house"></i>
                    Home

                </a>

            </div>

        </div>

    </nav>


    <!-- REGISTER SECTION -->

    <section class="auth-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-5 col-md-7">

                    <div class="auth-card">

                        <div class="text-center mb-4">

                            <div class="auth-icon">

                                <i class="bi bi-person-plus-fill"></i>

                            </div>

                            <h2 class="mt-3">
                                Create your account
                            </h2>

                            <p class="text-muted">
                                Join BusGo and make your journeys easier.
                            </p>

                        </div>


                        <!-- REGISTER FORM -->

                        <form id="registerForm">

                            <!-- Name -->

                            <div class="mb-3">

                                <label
                                    for="name"
                                    class="form-label">

                                    Full Name

                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required>

                            </div>


                            <!-- Email -->

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <!-- Phone -->

                            <div class="mb-3">

                                <label
                                    for="phone"
                                    class="form-label">

                                    Phone Number

                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    class="form-control"
                                    placeholder="Enter your phone number"
                                    maxlength="15"
                                    required>

                            </div>


                            <!-- Password -->

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Create a password"
                                    required>

                            </div>


                            <!-- Confirm Password -->

                            <div class="mb-4">

                                <label
                                    for="confirmPassword"
                                    class="form-label">

                                    Confirm Password

                                </label>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="Confirm your password"
                                    required>

                            </div>


                            <!-- Message -->

                            <div
                                id="registerMessage"
                                class="mb-3">
                            </div>


                            <!-- Button -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100 auth-btn">

                                <i class="bi bi-person-plus"></i>

                                Create Account

                            </button>

                        </form>


                        <!-- LOGIN LINK -->

                        <div class="text-center mt-4">

                            <span class="text-muted">
                                Already have an account?
                            </span>

                            <a href="login.html"
                               class="fw-semibold">

                                Login

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/auth.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BusGo | Select Your Seat</title>

    <meta name="description"
          content="Select your preferred bus seat">

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            <i class="bi bi-bus-front-fill"></i>

            BusGo

        </a>


        <div class="ms-auto">

            <a
                href="bus-results.html"
                class="btn btn-outline-primary">

                <i class="bi bi-arrow-left"></i>

                Back to Buses

            </a>

        </div>

    </div>

</nav>



<!-- ================= SEAT SECTION ================= -->

<section class="py-5">

    <div class="container">

        <div class="row g-4">


            <!-- ================= BUS INFORMATION ================= -->

            <div class="col-lg-4">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-3">

                            <i class="bi bi-bus-front-fill text-primary"></i>

                            Bus Details

                        </h4>


                        <div id="busDetails">

                            <div class="text-center">

                                <div
                                    class="spinner-border text-primary">
                                </div>

                                <p class="text-muted mt-2">

                                    Loading bus details...

                                </p>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ================= LEGEND ================= -->

                <div class="card border-0 shadow-sm mt-4">

                    <div class="card-body p-4">

                        <h5 class="fw-bold">

                            Seat Status

                        </h5>


                        <div class="d-flex align-items-center mb-3">

                            <div class="seat-legend available-seat">
                            </div>

                            <span class="ms-2">
                                Available
                            </span>

                        </div>


                        <div class="d-flex align-items-center mb-3">

                            <div class="seat-legend selected-seat">
                            </div>

                            <span class="ms-2">
                                Selected
                            </span>

                        </div>


                        <div class="d-flex align-items-center">

                            <div class="seat-legend booked-seat">
                            </div>

                            <span class="ms-2">
                                Booked
                            </span>

                        </div>

                    </div>

                </div>

            </div>



            <!-- ================= SEAT MAP ================= -->

            <div class="col-lg-8">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4">

                        <div class="text-center mb-4">

                            <h2 class="fw-bold">

                                Select Your Seat

                            </h2>

                            <p class="text-muted">

                                Choose an available seat for your journey.

                            </p>

                        </div>


                        <!-- DRIVER -->

                        <div class="driver-area">

                            <i class="bi bi-person-fill"></i>

                            Driver

                        </div>


                        <!-- SEATS -->

                        <div
                            id="seatContainer"
                            class="seat-container">

                            <div class="text-center">

                                <div
                                    class="spinner-border text-primary">
                                </div>

                                <p class="text-muted mt-2">

                                    Loading seats...

                                </p>

                            </div>

                        </div>


                        <!-- SELECTED SEAT -->

                        <div class="selected-seat-info mt-4">

                            <div class="row align-items-center">

                                <div class="col-md-6">

                                    <span class="text-muted">

                                        Selected Seat:

                                    </span>

                                    <strong
                                        id="selectedSeatText">

                                        None

                                    </strong>

                                </div>


                                <div class="col-md-6 text-md-end mt-2 mt-md-0">

                                    <button
                                        id="continueButton"
                                        class="btn btn-primary"
                                        disabled>

                                        Continue

                                        <i class="bi bi-arrow-right"></i>

                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>



<!-- ================= BOOTSTRAP JS ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- ================= SEAT JS ================= -->

<script src="js/seat-selection.js"></script>


</body>

</html>

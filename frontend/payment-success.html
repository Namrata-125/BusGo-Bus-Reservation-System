<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BusGo | Payment Successful</title>

    <meta name="description"
          content="Your BusGo payment was successful">

    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            <i class="bi bi-bus-front-fill"></i>

            BusGo

        </a>

    </div>

</nav>


<!-- ================= SUCCESS SECTION ================= -->

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <!-- SUCCESS CARD -->

                <div
                    class="card border-0 shadow-sm text-center">

                    <div class="card-body p-5">

                        <div class="mb-4">

                            <div
                                class="d-inline-flex align-items-center justify-content-center"
                                style="
                                    width: 90px;
                                    height: 90px;
                                    border-radius: 50%;
                                    background: #d1e7dd;
                                    color: #198754;
                                    font-size: 3rem;
                                ">

                                <i class="bi bi-check-lg"></i>

                            </div>

                        </div>


                        <h1 class="fw-bold">

                            Payment Successful!

                        </h1>


                        <p class="text-muted mt-3">

                            Your payment has been successfully processed.

                            Your bus booking is now confirmed.

                        </p>


                        <div
                            id="transactionInfo"
                            class="mt-4">
                        </div>

                    </div>

                </div>


                <!-- ================= PAYMENT DETAILS ================= -->

                <div
                    class="card border-0 shadow-sm mt-4">

                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-4">

                            <i
                                class="bi bi-receipt text-primary">
                            </i>

                            Payment Details

                        </h4>


                        <div id="paymentDetails">

                            <div class="text-center">

                                <div
                                    class="spinner-border text-primary">
                                </div>

                                <p class="text-muted mt-2">

                                    Loading payment details...

                                </p>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ================= ACTIONS ================= -->

                <div
                    class="text-center mt-4">

                    <a
                        href="index.html"
                        class="btn btn-primary me-2">

                        <i class="bi bi-house"></i>

                        Home

                    </a>


                    <a
                        href="booking-success.html"
                        class="btn btn-outline-primary">

                        <i class="bi bi-ticket-perforated"></i>

                        View Booking

                    </a>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- ================= BOOTSTRAP JS ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- PAYMENT SUCCESS JS -->

<script src="js/payment-success.js"></script>

</body>

</html>

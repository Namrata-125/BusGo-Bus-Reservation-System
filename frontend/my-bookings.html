
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | BusGo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">BusGo</a>

        <div class="ms-auto d-flex gap-2">
            <a href="index.html" class="btn btn-light btn-sm">Home</a>
            <button id="logoutBtn" class="btn btn-outline-light btn-sm">
                Logout
            </button>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="mb-4">
        <h1 class="fw-bold">My Bookings</h1>
        <p class="text-muted">
            View your bus reservations and manage your journeys.
        </p>
    </div>

    <div id="message" class="alert d-none" role="alert"></div>

    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 text-muted">Loading your bookings...</p>
    </div>

    <div id="emptyState" class="text-center py-5 d-none">
        <h4>No bookings yet</h4>
        <p class="text-muted">Your reservations will appear here.</p>
        <a href="index.html" class="btn btn-primary">Search Buses</a>
    </div>

    <div id="bookingsContainer" class="row g-4"></div>
</main>

<script src="js/my-bookings.js"></script>
</body>
</html>

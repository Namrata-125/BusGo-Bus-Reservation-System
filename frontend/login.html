<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusGo | Login</title>

    <meta name="description"
          content="Login to your BusGo account">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="index.html">

                <i class="bi bi-bus-front-fill"></i>
                BusGo

            </a>

            <div class="ms-auto">

                <a href="index.html"
                   class="btn btn-outline-primary">

                    <i class="bi bi-house"></i>
                    Home

                </a>

            </div>

        </div>

    </nav>


    <!-- LOGIN SECTION -->

    <section class="auth-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-5 col-md-7">

                    <div class="auth-card">

                        <!-- HEADER -->

                        <div class="text-center mb-4">

                            <div class="auth-icon">

                                <i class="bi bi-box-arrow-in-right"></i>

                            </div>

                            <h2 class="mt-3">
                                Welcome back
                            </h2>

                            <p class="text-muted">
                                Login to continue with BusGo.
                            </p>

                        </div>


                        <!-- LOGIN FORM -->

                        <form id="loginForm">

                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label
                                    for="loginEmail"
                                    class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    id="loginEmail"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <!-- PASSWORD -->

                            <div class="mb-4">

                                <label
                                    for="loginPassword"
                                    class="form-label">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    id="loginPassword"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    required>

                            </div>


                            <!-- MESSAGE -->

                            <div
                                id="loginMessage"
                                class="mb-3">
                            </div>


                            <!-- LOGIN BUTTON -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100 auth-btn">

                                <i class="bi bi-box-arrow-in-right"></i>

                                Login

                            </button>

                        </form>


                        <!-- REGISTER LINK -->

                        <div class="text-center mt-4">

                            <span class="text-muted">
                                Don't have an account?
                            </span>

                            <a href="register.html"
                               class="fw-semibold">

                                Create Account

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Authentication JS -->

    <script src="js/auth.js"></script>

</body>

</html>

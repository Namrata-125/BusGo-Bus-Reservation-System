<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BusGo | Booking Details</title>

    <meta name="description"
          content="Enter passenger details and confirm your BusGo booking">

    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            <i class="bi bi-bus-front-fill"></i>

            BusGo

        </a>

        <div class="ms-auto">

            <a
                href="seat-selection.html"
                class="btn btn-outline-primary">

                <i class="bi bi-arrow-left"></i>

                Back to Seat

            </a>

        </div>

    </div>

</nav>


<!-- ================= BOOKING SECTION ================= -->

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-9">

                <!-- PAGE HEADER -->

                <div class="text-center mb-5">

                    <span class="badge bg-primary-subtle text-primary mb-2">

                        <i class="bi bi-ticket-perforated"></i>

                        Almost Done

                    </span>

                    <h1 class="fw-bold">

                        Passenger Details

                    </h1>

                    <p class="text-muted">

                        Enter the passenger information to continue
                        with your booking.

                    </p>

                </div>


                <div class="row g-4">

                    <!-- ================= JOURNEY SUMMARY ================= -->

                    <div class="col-lg-5">

                        <div class="card border-0 shadow-sm">

                            <div class="card-body p-4">

                                <h4 class="fw-bold mb-4">

                                    <i class="bi bi-receipt text-primary"></i>

                                    Booking Summary

                                </h4>

                                <div id="bookingSummary">

                                    <div class="text-center">

                                        <div
                                            class="spinner-border text-primary">
                                        </div>

                                        <p class="text-muted mt-2">

                                            Loading booking details...

                                        </p>

                                    </div>

                                </div>

                            </div>

                        </div>


                        <!-- SECURITY INFORMATION -->

                        <div class="card border-0 shadow-sm mt-4">

                            <div class="card-body p-4">

                                <h6 class="fw-bold">

                                    <i class="bi bi-shield-check text-success"></i>

                                    Secure Booking

                                </h6>

                                <p class="text-muted small mb-0">

                                    Your booking information is securely
                                    processed through the BusGo system.

                                </p>

                            </div>

                        </div>

                    </div>


                    <!-- ================= PASSENGER FORM ================= -->

                    <div class="col-lg-7">

                        <div class="card border-0 shadow-sm">

                            <div class="card-body p-4">

                                <h4 class="fw-bold mb-4">

                                    Passenger Information

                                </h4>


                                <form id="bookingForm">

                                    <!-- PASSENGER NAME -->

                                    <div class="mb-4">

                                        <label
                                            for="passengerName"
                                            class="form-label fw-semibold">

                                            Passenger Name

                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">

                                                <i class="bi bi-person"></i>

                                            </span>

                                            <input
                                                type="text"
                                                id="passengerName"
                                                class="form-control"
                                                placeholder="Enter passenger name"
                                                required>

                                        </div>

                                    </div>


                                    <!-- MESSAGE -->

                                    <div
                                        id="bookingMessage"
                                        class="mb-3">
                                    </div>


                                    <!-- CONTINUE -->

                                    <button
                                        type="submit"
                                        id="confirmBookingButton"
                                        class="btn btn-primary w-100">

                                        <i class="bi bi-check-circle"></i>

                                        Confirm Booking

                                    </button>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- ================= BOOTSTRAP JS ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- BOOKING JS -->

<script src="js/booking.js"></script>

</body>

</html>
